      all_bodies: "2"  # Single view contains City Council, Planning Commission, Parks & Rec
    metadata:
      granicus_domain: cityofmillvalley
      default_view_id: "2"
      notes: "View IDs 2 and 3 contain same data. All bodies combined in single view."

  # Issue tracking
  issues: null  # TODO: check if Mill Valley uses SeeClickFix

  # Municipal code
  municipal_code: null  # TODO: identify source

