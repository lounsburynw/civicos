# San Francisco City & County Configuration
#
# Unified configuration for City and County of San Francisco, California.
# SF is a consolidated city-county — no separate county entity.
#
# NOTE: Legistar events API is broken for SF (server config error).
# Meetings are extracted via Playwright+LLM on the Legistar web calendar.
# Legislation is still accessible via the Legistar matters API (client: sfgov).

# =============================================================================
# Identity
# =============================================================================

jurisdiction_id: city-san-francisco
level: city
display_name: San Francisco

# =============================================================================
# Hierarchy
# =============================================================================

parent_jurisdictions:
  - state-california
  - country-united-states

# =============================================================================
# Contact Information
# =============================================================================

contact_info:
  clerk_email: board.of.supervisors@sfgov.org
  city_hall_address: "1 Dr Carlton B Goodlett Pl, San Francisco, CA 94102"
  phone: "(415) 554-5184"
  website: "https://sf.gov"
  public_comment_deadline: "Noon the day before the meeting"
  in_person_time_limit: "2 minutes"
  public_comment_subject: "Public Comment - [Agenda Item Number]"

# =============================================================================
# Governing Body
# =============================================================================

governing_body:
  name: San Francisco Board of Supervisors
  members_title: Supervisors
  meeting_schedule: "Tuesdays, 2:00 PM"
  meeting_location: "Board of Supervisors Chambers, City Hall, Room 250"

# =============================================================================
# Data Sources
# =============================================================================

data_sources:
  # Meeting extraction (Playwright+LLM on Legistar web calendar)
  # Legistar events API is broken for SF; matters API works for legislation.
  meetings:
    source_type: playwright_llm
    base_url: https://sfgov.legistar.com/Calendar.aspx

  # Issue tracking (SeeClickFix / SF311)
  issues: seeclickfix

  # Budget data
  budget: municipal_portal

  # Municipal code
  municipal_code: municode

  # Meeting transcripts (SFGovTV YouTube)
  # TODO: Find correct SFGovTV channel (not South San Francisco)
  transcripts:
    source: youtube
    playlist_id: null

# =============================================================================
# Financial Context
# =============================================================================

financial:
  state: CA
  county: San Francisco

federal_programs:
  hud_grantee: City and County of San Francisco
  hud_relationship: entitlement
  usaspending:
    search_names:
      - "CITY & COUNTY OF SAN FRANCISCO"
      - "CITY AND COUNTY OF SAN FRANCISCO"
      - "SAN FRANCISCO HOUSING AUTHORITY"
    allowed_names:
      - "CITY & COUNTY OF SAN FRANCISCO"
      - "CITY AND COUNTY OF SAN FRANCISCO"
      - "SAN FRANCISCO HOUSING AUTHORITY"
  notes: "SF is a direct HUD entitlement city. Housing Authority is a separate entity but integral to city operations."

