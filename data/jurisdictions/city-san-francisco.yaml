# =============================================================================
# Ingestion Tiers
# =============================================================================

ingestion:
  # Tier 1: Free
  meetings: true
  pdf_chunks: true
  issues: true
  municipal_code: true
  # Tier 2: Low cost (LLM)
  agenda_items: true
  decisions: true
  legislation: true
  # Tier 3: Higher cost (audio) — disabled initially
  transcription: false
  diarization: false
  # Tier 4: GPU
  vector_indexing: true

# =============================================================================
# Refresh Policies
# =============================================================================

refresh:
  municipal_code:
    interval: 90d
    strategy: content_hash
  meetings:
    interval: 1d
    strategy: incremental
  issues:
    interval: 1d
    strategy: incremental
  legislation:
    interval: 7d
    strategy: incremental

# =============================================================================
# Tool Configuration
# =============================================================================

tools_enabled: null
tool_overrides: {}

# =============================================================================
# Modal Deployment
# =============================================================================

modal:
  min_containers: 0
  secrets:
    - civicos-env

# =============================================================================
# Metadata
# =============================================================================

metadata:
  created: "2026-04-06"
  notes: "Legistar events API has server-side config error. Meetings via Playwright+LLM on web calendar. Legislation via Legistar matters API (client: sfgov)."
