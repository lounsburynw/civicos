# Civic WebSocket Server - Fly.io Configuration
# Real-time coordination via Socket.IO
# See docs/critical/HOSTING_DECISION.md for deployment details

app = "civic-websocket"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  CIVIC_ENV = "production"
  PYTHONUNBUFFERED = "1"

[processes]
  app = "python -m civic_services.servers.civic_socketio_server 8002"

[http_service]
  internal_port = 8002
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "civic_data"
  destination = "/app/user-data"

[checks]
  [checks.health]
    type = "http"
    port = 8002
    path = "/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
