# CivicOS API - Fly.io Configuration
# Primary REST API server for CivicOS platform
# See docs/critical/HOSTING_DECISION.md for deployment details

app = "civicos-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  CIVICOS_ENV = "production"
  CIVICOS_API_PORT = "8001"
  CIVICOS_EMBEDDING_PROVIDER = "fastembed"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "civicos_data"
  destination = "/app/user-data"

[checks]
  [checks.health]
    type = "http"
    port = 8001
    path = "/health"
    interval = "30s"
    timeout = "10s"
    grace_period = "10s"
