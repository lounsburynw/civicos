# Marin County Configuration
#
# Jurisdiction configuration for County of Marin, California.
# Used by civicos-mcp tools for contact info, data sources, etc.

jurisdiction_id: county-marin
level: county
display_name: Marin County

# Hierarchy
parent_jurisdictions:
  - state-california
  - country-united-states

# Contact Information
contact_info:
  clerk_email: BOS@marincounty.gov
  city_hall_address: "3501 Civic Center Drive, Suite 329, San Rafael CA 94903"
  phone: "(415) 473-7331"
  website: "https://www.marincounty.gov"
  public_comment_deadline: "Noon the Monday before the Tuesday Board meeting"
  in_person_time_limit: "3 minutes"
  public_comment_subject: "Public Comment - [Agenda Item Title]"

# Governing Body
governing_body:
  name: Marin County Board of Supervisors
  members_title: Supervisors
  meeting_schedule: "Tuesdays, 9:00 AM"
  meeting_location: "Board of Supervisors Chambers, 3501 Civic Center Drive, San Rafael"

# Data Sources
data_sources:
  meetings: granicus
  issues: seeclickfix              # TBD - verify county 311 system
  budget: county_portal
  municipal_code: municode         # Marin County Code
  transcripts: youtube             # TBD - verify recording source

