# Federal (United States) Configuration
#
# Shared federal-level data and tools.
# Used by all city/county/state jurisdictions.

jurisdiction_id: country-united-states
level: federal
display_name: United States Federal

# No parent jurisdictions (top level)
parent_jurisdictions: []

# Data Sources
data_sources:
  legislation: congress_api      # Federal bills
  expenditures: fac_api          # Single Audit data
  funding: usaspending_api       # Federal spending

# Tools enabled at federal level
# Uses default federal-level tools from loader.py:
# - get_federal_expenditures (FAC Single Audit)
# - get_funding_flow (Federal funding traces)
# - search_regulatory_stack (Federal legislation)
# tools_enabled: omitted to use defaults
