<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        /* Default (light mode) - dark icon */
        .prompt { fill: #333333; }
        .cursor { fill: #666666; }

        /* Dark mode - light icon */
        @media (prefers-color-scheme: dark) {
            .prompt { fill: white; }
            .cursor { fill: #cccccc; }
        }
    </style>

    <!-- '<' prompt -->
    <polygon points="12,2 6,8 12,14 10,14 4,8 10,2" class="prompt"/>

    <!-- '_' cursor -->
    <rect x="13" y="14.5" width="3" height="0.8" class="cursor"/>
</svg>