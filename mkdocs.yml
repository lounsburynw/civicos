site_name: CivicOS
site_description: Open, permissionless civic infrastructure for AI agents
site_url: https://docs.civicosproject.org
repo_url: https://github.com/lounsburynw/civicos
repo_name: lounsburynw/civicos

theme:
  name: material
  logo: assets/logo-light.svg
  favicon: assets/logo-dark.svg
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

exclude_docs: |
  archive/
  private/
  next_session_prompt.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lounsburynw/civicos

nav:
  - Home:
    - Overview: index.md
    - Getting Started: user_guides/GETTING_STARTED.md
    - FAQ: user_guides/FAQ.md

  - User Guide:
    - Getting Started: user_guides/GETTING_STARTED.md
    - Features: user_guides/FEATURE_GUIDE.md
    - Browser Extension: user_guides/BROWSER_EXTENSION_SETUP.md
    - MCP Setup: user_guides/MCP_SETUP_GUIDE.md
    - Verification: user_guides/VERIFICATION_TUTORIAL.md
    - Attestation: user_guides/ATTESTATION_GUIDE.md

  - City Administration:
    - Onboarding a City: user_guides/CITY_ONBOARDING_GUIDE.md
    - Admin Setup: user_guides/ADMIN_SETUP_GUIDE.md
    - Data Management: user_guides/ADMIN_DATA_MANAGEMENT.md
    - Troubleshooting: user_guides/ADMIN_TROUBLESHOOTING.md

  - Architecture:
    - Package Architecture: critical/FINAL_PACKAGE_ARCHITECTURE.md
    - Coordination Protocol: critical/COORDINATION_PROTOCOL.md
    - Edge Intelligence: critical/EDGE_INTELLIGENCE_ARCHITECTURE.md
    - Browser Extension: critical/BROWSER_EXTENSION_ARCHITECTURE.md
    - MCP Integration: critical/MCP_INTEGRATION_STRATEGY.md
    - Nostr NIPs: critical/NOSTR_CIVIC_NIPS.md

  - Packages:
    - packages/index.md
    - civicos (Core API): packages/civicos.md
    - civicos-relay (Federation): packages/civicos-relay.md
    - civicos-extraction (Parsers): packages/civicos-extraction.md
    - civicos-mcp (MCP Server): packages/civicos-mcp.md

  - Learning:
    - learning/README.md
    - Cryptographic Foundations: learning/01_CRYPTOGRAPHIC_FOUNDATIONS.md
    - Nostr & the Relay: learning/02_NOSTR_AND_THE_RELAY.md
    - Attestation: learning/03_ATTESTATION_AND_THE_FULL_SYSTEM.md
    - Relay Trust: learning/04_RELAY_TRUST_AND_INTEGRITY.md
    - Jurisdiction Scope: learning/05_JURISDICTION_SCOPE_AND_ATTESTATION_ROLLUP.md
    - Economic Model: learning/06_ECONOMIC_MODEL_AND_SUSTAINABILITY.md

  - About:
    - Essay — The Nervous System: essays/the_nervous_system_we_choose_to_build.md
