site_name: CivicOS
site_description: Open, permissionless civic infrastructure for AI agents
site_url: https://docs.civicosproject.org
repo_url: https://github.com/lounsburynw/civicos
repo_name: lounsburynw/civicos

theme:
  name: material
  logo: public/assets/logo-light.svg
  favicon: public/assets/logo-dark.svg
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

exclude_docs: |
  archive/
  private/
  internal/
  next_session_prompt.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lounsburynw/civicos

nav:
  - Home:
    - Overview: index.md

  - Extension:
    - Setup: public/extension/setup.md
    - Development: public/extension/development.md

  - MCP Server:
    - Setup: public/mcp/setup.md

  - Relay:
    - Overview: public/relay/overview.md
    - Attestation: public/relay/attestation.md
    - Trust Model: public/relay/trust.md
    - Federation: public/relay/federation.md
    - AI Proxy: public/relay/ai-proxy.md

  - API & Data:
    - Architecture: public/README.md
    - Core API: public/api.md
    - Data Dictionary: public/data-dictionary.md

  - Packages:
    - civicos (Core API): public/packages/civicos.md
    - civicos-services (REST API): public/packages/civicos-services.md
    - civicos-relay (Coordination): public/packages/civicos-relay.md
    - civicos-extraction (Parsers): public/packages/civicos-extraction.md
    - civicos-client (TypeScript): public/packages/civicos-client.md
    - civicos-components (Svelte UI): public/packages/civicos-components.md

  - Decisions:
    - Vector Storage: public/decisions/vector_storage.md
    - Data Integrity: public/decisions/data_integrity_infrastructure.md
    - Entity ID Namespace: public/decisions/entity_id_namespace.md
    - Data Source Federation: public/decisions/data_source_federation.md
    - Federation Domains: public/decisions/federation_domain_architecture.md

  - Learning:
    - public/learning/README.md
    - Cryptographic Foundations: public/learning/01_CRYPTOGRAPHIC_FOUNDATIONS.md
    - Nostr & the Relay: public/learning/02_NOSTR_AND_THE_RELAY.md
    - Attestation: public/learning/03_ATTESTATION_AND_THE_FULL_SYSTEM.md
    - Relay Trust: public/learning/04_RELAY_TRUST_AND_INTEGRITY.md
    - Jurisdiction Scope: public/learning/05_JURISDICTION_SCOPE_AND_ATTESTATION_ROLLUP.md
    - Economic Model: public/learning/06_ECONOMIC_MODEL_AND_SUSTAINABILITY.md

  - About:
    - Essay — The Nervous System: public/essays/the_nervous_system_we_choose_to_build.md
