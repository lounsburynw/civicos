# Daily Cost Digest for Civic Platform
#
# Runs daily at 9:00 AM UTC (1:00 AM Pacific / 4:00 AM Eastern)
# Sends email summary of operating costs vs budget thresholds
#
# Prerequisites:
#   - DATABASE_URL secret configured (Supabase PostgreSQL)
#   - CIVICOS_ALERT_EMAILS secret (comma-separated recipients)
#   - CIVICOS_SMTP_* secrets for email delivery
#   - Optional: CIVICOS_SLACK_WEBHOOK_URL for Slack notifications

name: Daily Cost Digest

on:
  schedule:
    # Run daily at 9:00 AM UTC (1:00 AM Pacific)
    - cron: '0 9 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview without sending (true/false)'
        required: false
        default: 'false'
        type: boolean

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  CIVICOS_ALERT_EMAILS: ${{ secrets.CIVICOS_ALERT_EMAILS }}
  CIVICOS_SMTP_SERVER: ${{ secrets.CIVICOS_SMTP_SERVER }}
  CIVICOS_SMTP_PORT: ${{ secrets.CIVICOS_SMTP_PORT }}
  CIVICOS_SMTP_USERNAME: ${{ secrets.CIVICOS_SMTP_USERNAME }}
  CIVICOS_SMTP_PASSWORD: ${{ secrets.CIVICOS_SMTP_PASSWORD }}
  # CIVICOS_NTFY_WEBHOOK_URL is the full URL (e.g. https://ntfy.sh/civicos-admin-123).
  # notify.py expects CIVICOS_NTFY_TOPIC (just the topic name), so extract it.
  CIVICOS_NTFY_WEBHOOK_URL: ${{ secrets.CIVICOS_NTFY_WEBHOOK_URL }}
  CIVICOS_SLACK_WEBHOOK_URL: ${{ secrets.CIVICOS_SLACK_WEBHOOK_URL }}
  CIVICOS_DAILY_BUDGET: '5.0'
  CIVICOS_MONTHLY_BUDGET: '50.0'

# Permissions needed for creating issues on failure
permissions:
  issues: write
  contents: read

jobs:
  send-digest:
    name: Send Cost Digest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -q -e packages/civicos-config
          pip install -q -e packages/civicos
          pip install -q -e packages/civicos-services
          pip install python-dotenv psycopg2-binary

      - name: Preview Digest (if requested)
        if: ${{ github.event.inputs.preview_only == 'true' }}
        run: |
          echo "=== COST DIGEST PREVIEW ==="
          python -c "
          from civic_services.monitoring.daily_cost_digest import DailyCostDigest
          digest = DailyCostDigest()
          preview = digest.preview()
          print(f\"Date: {preview['data']['date']}\")
          print(f\"Status: {preview['data']['budget_status']}\")
          print(f\"Total: \${preview['data']['total_cost_usd']:.4f}\")
          print()
          print('=== PLAINTEXT ===' )
          print(preview['plaintext'])
          "

      - name: Extract ntfy topic from webhook URL
        if: ${{ env.CIVICOS_NTFY_WEBHOOK_URL != '' }}
        run: |
          # Webhook URL format: https://ntfy.sh/topic-name
          # notify.py expects CIVICOS_NTFY_TOPIC=topic-name and CIVICOS_NTFY_URL=https://ntfy.sh
          URL="${{ env.CIVICOS_NTFY_WEBHOOK_URL }}"
          TOPIC=$(echo "$URL" | sed -E 's|^https?://[^/]+/||')
          SERVER=$(echo "$URL" | sed -E "s|/${TOPIC}$||")
          echo "CIVICOS_NTFY_TOPIC=${TOPIC}" >> $GITHUB_ENV
          echo "CIVICOS_NTFY_URL=${SERVER}" >> $GITHUB_ENV
          echo "Extracted topic: ${TOPIC}, server: ${SERVER}"

      - name: Send Cost Digest
        if: ${{ github.event.inputs.preview_only != 'true' }}
        id: digest
        run: |
          python -c "
          import json
          from civic_services.monitoring.daily_cost_digest import send_daily_digest

          result = send_daily_digest()
          print(json.dumps(result, indent=2))

          # Output for GitHub Actions
          if result.get('success'):
              print('digest_status=success')
          else:
              print('digest_status=failed')
              print(f\"reason={result.get('reason', 'unknown')}\")
          " | tee digest_output.txt

          # Parse output for GitHub Actions
          if grep -q '"success": true' digest_output.txt; then
            echo "digest_status=success" >> $GITHUB_OUTPUT
          else
            echo "digest_status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Report Status
        if: always() && github.event.inputs.preview_only != 'true'
        run: |
          echo "=========================================="
          echo "Daily Cost Digest Summary"
          echo "=========================================="
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Status: ${{ steps.digest.outputs.digest_status || 'unknown' }}"

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: send-digest
    if: failure()

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily cost digest failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Daily Cost Digest Failure

            The scheduled daily cost digest workflow failed.

            **Time:** ${new Date().toISOString()}
            **Workflow Run:** [View logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})

            ### Troubleshooting Steps

            1. Check the [workflow logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            2. Verify DATABASE_URL secret is configured
            3. Verify SMTP secrets are configured
            4. Test manually: \`python packages/civicos-services/src/civic_services/monitoring/daily_cost_digest.py --preview\`

            ### Manual Recovery

            Run digest manually:
            \`\`\`bash
            source civicos-env/bin/activate
            python packages/civicos-services/src/civic_services/monitoring/daily_cost_digest.py --send
            \`\`\`
            `;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'cost-digest-failure',
              state: 'open'
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['cost-digest-failure', 'automated']
              });
              console.log('Created new issue for digest failure');
            } else {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another cost digest failure occurred at ${new Date().toISOString()}\n\n[View workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
              });
              console.log('Added comment to existing issue');
            }
