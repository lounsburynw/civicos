# Data Freshness Alerting for Civic Platform
#
# Daily check for data pipeline health across ALL jurisdictions and corpus types.
#
# Checks:
#   1. Corpus staleness — each corpus type has a max-age threshold
#   2. Cron health — each cron workflow must have succeeded within its cadence window
#   3. Pipeline errors — refresh_metadata entries with status='failed'
#
# Creates GitHub Issue on threshold breach.
#
# Triggers:
#   - Daily at 8:00 AM UTC (12:00 AM Pacific)
#   - Manual trigger via workflow_dispatch

name: Data Freshness

on:
  schedule:
    # Daily at 8:00 AM UTC (12:00 AM Pacific)
    - cron: '0 8 * * *'

  # Allow manual trigger
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

# Permissions needed for creating issues on failure
permissions:
  issues: write
  contents: read

jobs:
  check-freshness:
    name: Check Data Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      has_alerts: ${{ steps.check.outputs.has_alerts }}
      report: ${{ steps.check.outputs.report }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Check corpus freshness and pipeline health
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone, timedelta

          database_url = os.environ.get("DATABASE_URL")
          if not database_url:
              print("ERROR: DATABASE_URL not set")
              sys.exit(1)

          import psycopg2
          conn = psycopg2.connect(database_url)
          cur = conn.cursor()

          alerts = []
          info = []

          # ================================================================
          # 1. Corpus staleness via refresh_metadata
          # ================================================================
          # Max age (days) before a corpus is considered stale.
          # These are generous — real cadences are tighter (daily/weekly).
          # The goal is to catch multi-week outages, not daily jitter.
          STALENESS_THRESHOLDS = {
              "meetings":    {"max_days": 3,  "label": "Meetings"},
              "issues":      {"max_days": 3,  "label": "Issues (311)"},
              "decisions":   {"max_days": 14, "label": "Decisions"},
              "legislation": {"max_days": 14, "label": "Legislation"},
              "elections":   {"max_days": 3,  "label": "Elections"},
              "elected_officials": {"max_days": 3, "label": "Elected Officials"},
          }

          print("=" * 70)
          print("CORPUS FRESHNESS CHECK")
          print("=" * 70)

          # Get latest refresh per jurisdiction + corpus type
          cur.execute("""
              SELECT jurisdiction_id, corpus_type, status,
                     last_fetch_at, error_message
              FROM refresh_metadata
              WHERE corpus_type IN %s
              ORDER BY jurisdiction_id, corpus_type
          """, (tuple(STALENESS_THRESHOLDS.keys()),))

          rows = cur.fetchall()
          now = datetime.now()

          # Track which jurisdictions have each corpus
          seen = set()
          stale_corpora = []
          failed_corpora = []

          for jid, corpus, status, last_fetch, error in rows:
              seen.add((jid, corpus))
              threshold = STALENESS_THRESHOLDS.get(corpus, {})
              max_days = threshold.get("max_days", 7)
              label = threshold.get("label", corpus)

              if status == "failed":
                  age_str = f"last attempt: {last_fetch.strftime('%Y-%m-%d') if last_fetch else 'never'}"
                  err_short = (error or "unknown")[:80]
                  failed_corpora.append(f"  - **{jid}** / {label}: `{err_short}` ({age_str})")
                  print(f"  FAILED: {jid} / {label}: {err_short}")
                  continue

              if last_fetch is None:
                  stale_corpora.append(f"  - **{jid}** / {label}: never fetched")
                  print(f"  STALE: {jid} / {label}: never fetched")
                  continue

              age_days = (now - last_fetch).total_seconds() / 86400
              if age_days > max_days:
                  stale_corpora.append(
                      f"  - **{jid}** / {label}: {age_days:.0f} days old (threshold: {max_days}d)"
                  )
                  print(f"  STALE: {jid} / {label}: {age_days:.0f}d old (max {max_days}d)")
              else:
                  print(f"  OK: {jid} / {label}: {age_days:.1f}d old")

          if stale_corpora:
              alerts.append("### Stale Corpora\n" + "\n".join(stale_corpora))
          if failed_corpora:
              alerts.append("### Failed Refreshes\n" + "\n".join(failed_corpora))

          # ================================================================
          # 2. Cron workflow health via GitHub API
          # ================================================================
          print("\n" + "=" * 70)
          print("CRON WORKFLOW HEALTH")
          print("=" * 70)

          CRON_CADENCES = {
              "cron-high-velocity-refresh.yml":   {"max_hours": 48, "label": "High-Velocity Refresh"},
              "cron-meetings-poll.yml":            {"max_hours": 12, "label": "Meetings Poll"},
              "cron-low-velocity-refresh.yml":     {"max_hours": 192, "label": "Low-Velocity Refresh (weekly)"},
              "cron-california-legislation.yml":   {"max_hours": 192, "label": "CA Legislation (weekly)"},
              "cron-election-refresh.yml":         {"max_hours": 48, "label": "Election Refresh"},
          }

          cron_failures = []
          for workflow_file, config in CRON_CADENCES.items():
              max_hours = config["max_hours"]
              label = config["label"]
              try:
                  result = subprocess.run(
                      ["gh", "run", "list",
                       f"--workflow={workflow_file}",
                       "--limit=1",
                       "--json=conclusion,startedAt",
                       "--jq=.[0]"],
                      capture_output=True, text=True, timeout=30
                  )
                  if result.returncode != 0 or not result.stdout.strip():
                      cron_failures.append(f"  - **{label}**: could not query workflow status")
                      print(f"  UNKNOWN: {label}")
                      continue

                  run = json.loads(result.stdout.strip())
                  conclusion = run.get("conclusion", "unknown")
                  started = run.get("startedAt", "")

                  if started:
                      run_time = datetime.fromisoformat(started.replace("Z", "+00:00"))
                      age_hours = (datetime.now(timezone.utc) - run_time).total_seconds() / 3600
                  else:
                      age_hours = 999

                  if conclusion == "failure":
                      cron_failures.append(
                          f"  - **{label}**: last run FAILED ({age_hours:.0f}h ago)"
                      )
                      print(f"  FAILED: {label}: last run failed {age_hours:.0f}h ago")
                  elif age_hours > max_hours:
                      cron_failures.append(
                          f"  - **{label}**: last success {age_hours:.0f}h ago (threshold: {max_hours}h)"
                      )
                      print(f"  STALE: {label}: {age_hours:.0f}h since last run (max {max_hours}h)")
                  else:
                      print(f"  OK: {label}: {conclusion} {age_hours:.0f}h ago")

              except Exception as e:
                  cron_failures.append(f"  - **{label}**: check error: {str(e)[:60]}")
                  print(f"  ERROR: {label}: {e}")

          if cron_failures:
              alerts.append("### Cron Workflow Issues\n" + "\n".join(cron_failures))

          conn.close()

          # ================================================================
          # 3. Output results
          # ================================================================
          has_alerts = len(alerts) > 0
          report = "\n\n".join(alerts) if alerts else "All checks passed."

          print(f"\n{'!' * 70}")
          print(f"RESULT: {'ALERTS FOUND' if has_alerts else 'ALL OK'}")
          print(f"{'!' * 70}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_alerts={'true' if has_alerts else 'false'}\n")

          # Write report to file (avoids shell escaping issues)
          with open("freshness_report.md", "w") as f:
              f.write(report)

          PYEOF

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: freshness_report.md

  # Push notification + GitHub issue on failure
  notify-failure:
    name: Alert on Pipeline Issues
    runs-on: ubuntu-latest
    needs: check-freshness
    if: needs.check-freshness.outputs.has_alerts == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: freshness-report

      - name: Send push notification via ntfy
        if: env.NTFY_URL != ''
        env:
          NTFY_URL: ${{ secrets.CIVICOS_NTFY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REPORT=$(cat freshness_report.md | head -20)
          curl -s \
            -H "Title: Data pipeline alert" \
            -H "Priority: 4" \
            -H "Tags: warning,chart_with_downwards_trend" \
            -H "Click: ${RUN_URL}" \
            -d "${REPORT}" \
            "${NTFY_URL}" || echo "ntfy push failed (non-fatal)"

      - name: Create or Update Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('freshness_report.md', 'utf8');
            const today = new Date().toISOString().split('T')[0];

            const title = `Data pipeline alert - ${today}`;
            const body = `## Data Pipeline Health Alert

            **Time:** ${new Date().toISOString()}
            **Workflow Run:** [View logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})

            ${report}

            ### How to investigate

            1. Check cron logs: \`gh run view <run-id> --log-failed\`
            2. Check refresh metadata: \`/data-status\` in Claude Code
            3. Re-run failed cron: \`gh workflow run <workflow>.yml\`
            `;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-freshness-alert',
              state: 'open'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['data-freshness-alert', 'automated']
              });
              console.log('Created new data freshness alert issue');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `## Daily Check - ${today}\n\n${body}`
              });
              console.log('Added comment to existing issue');
            }
