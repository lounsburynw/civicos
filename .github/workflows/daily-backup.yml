# Daily Database Backup for Civic Platform
#
# Runs daily at 2:00 AM UTC (6:00 PM Pacific / 9:00 PM Eastern)
# Backs up both SQLite databases with checksums and applies retention policy
#
# Prerequisites:
#   - FLY_API_TOKEN secret configured in repository settings
#   - Fly.io CLI installed in workflow
#   - civic-api app deployed on Fly.io

name: Daily Backup

on:
  schedule:
    # Run daily at 2:00 AM UTC (6:00 PM Pacific)
    - cron: '0 2 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APP_NAME: civic-api

jobs:
  backup:
    name: Backup Databases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run Backup
        id: backup
        run: |
          echo "Starting daily backup..."

          # Run backup script on production server
          flyctl ssh console -a $APP_NAME -C "python scripts/backup.py --compress" 2>&1 | tee backup_output.txt

          # Check if backup succeeded
          if grep -q "Backup complete: 2 succeeded, 0 failed" backup_output.txt; then
            echo "backup_status=success" >> $GITHUB_OUTPUT
            echo "Backup completed successfully"
          else
            echo "backup_status=failed" >> $GITHUB_OUTPUT
            echo "Backup may have failed - check output"
            exit 1
          fi

      - name: Verify Backups
        run: |
          echo "Verifying latest backups..."

          # List backups and verify most recent
          flyctl ssh console -a $APP_NAME -C "python scripts/backup.py --status"

      - name: Apply Retention Policy
        run: |
          echo "Applying retention policy (7 daily + 4 weekly)..."

          # Clean old backups
          flyctl ssh console -a $APP_NAME -C "python scripts/backup.py --clean"

      - name: Report Status
        if: always()
        run: |
          echo "=========================================="
          echo "Daily Backup Summary"
          echo "=========================================="
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Status: ${{ steps.backup.outputs.backup_status || 'unknown' }}"
          echo ""

          # Show current backup inventory
          flyctl ssh console -a $APP_NAME -C "python scripts/backup.py --list"

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: backup
    if: failure()

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily backup failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Daily Backup Failure

            The scheduled daily backup workflow failed.

            **Time:** ${new Date().toISOString()}
            **Workflow Run:** [View logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})

            ### Troubleshooting Steps

            1. Check the [workflow logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            2. Verify Fly.io service is running: \`fly status -a civic-api\`
            3. Check disk space: \`fly ssh console -a civic-api -C "df -h /app/data"\`
            4. Try manual backup: \`fly ssh console -a civic-api -C "python scripts/backup.py"\`

            ### Manual Recovery

            If automated backups continue failing, run backup manually:
            \`\`\`bash
            fly ssh console -a civic-api -C "python scripts/backup.py --compress"
            \`\`\`
            `;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'backup-failure',
              state: 'open'
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['backup-failure', 'automated']
              });
              console.log('Created new issue for backup failure');
            } else {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another backup failure occurred at ${new Date().toISOString()}\n\n[View workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
              });
              console.log('Added comment to existing issue');
            }
