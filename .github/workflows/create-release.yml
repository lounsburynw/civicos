# Create Release Tag for Civic Platform
#
# Semi-automated workflow to create Git tags for deployments.
# Triggered manually via workflow_dispatch.
#
# Usage:
#   1. Go to Actions > Create Release > Run workflow
#   2. Enter version (e.g., "0.2.1") and release type
#   3. Workflow creates annotated tag and pushes to origin
#
# See: docs/critical/VERSIONING_STRATEGY.md

name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without v prefix, e.g., 0.2.1)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      notes:
        description: 'Release notes (brief description of changes)'
        required: false
        type: string
        default: ''
      session:
        description: 'Session number (optional, for tracking)'
        required: false
        type: string
        default: ''

jobs:
  create-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for tag creation

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 0.2.1)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Check tag doesn't exist
        run: |
          TAG_NAME="v${{ inputs.version }}-pilot-$(date +%Y%m%d)"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Error: Tag $TAG_NAME already exists"
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Tag name: $TAG_NAME"

      - name: Generate tag message
        run: |
          RELEASE_TYPE="${{ inputs.release_type }}"
          NOTES="${{ inputs.notes }}"
          SESSION="${{ inputs.session }}"

          # Build message
          MSG="Pilot release: v${{ inputs.version }}\n\n"
          MSG+="Type: $RELEASE_TYPE\n"

          if [ -n "$NOTES" ]; then
            MSG+="Notes: $NOTES\n"
          fi

          if [ -n "$SESSION" ]; then
            MSG+="\nSession: $SESSION"
          fi

          MSG+="\nCreated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          MSG+="\nWorkflow: ${{ github.workflow }}"

          # Save for next step
          echo -e "$MSG" > /tmp/tag_message.txt
          echo "Tag message:"
          cat /tmp/tag_message.txt

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" -F /tmp/tag_message.txt
          echo "Created tag: $TAG_NAME"

      - name: Push tag
        run: |
          git push origin "$TAG_NAME"
          echo "Pushed tag: $TAG_NAME"

      - name: Create summary
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`$TAG_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ inputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ inputs.release_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commands" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# View tag" >> $GITHUB_STEP_SUMMARY
          echo "git show $TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Checkout tag" >> $GITHUB_STEP_SUMMARY
          echo "git checkout $TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Roll back to this version" >> $GITHUB_STEP_SUMMARY
          echo "git checkout $TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "fly deploy -a civic-api" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    needs: create-tag
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Append to CHANGELOG
        run: |
          TAG_NAME="v${{ inputs.version }}-pilot-$(date +%Y%m%d)"
          DATE=$(date +%Y-%m-%d)
          NOTES="${{ inputs.notes }}"
          SESSION="${{ inputs.session }}"

          # Create entry
          ENTRY="## [$TAG_NAME] - $DATE\n\n"
          ENTRY+="**Type:** ${{ inputs.release_type }}\n\n"

          if [ -n "$NOTES" ]; then
            ENTRY+="$NOTES\n\n"
          fi

          if [ -n "$SESSION" ]; then
            ENTRY+="Session: $SESSION\n\n"
          fi

          # Check if CHANGELOG.md exists
          if [ -f "CHANGELOG.md" ]; then
            # Insert after the header (after first ## line or after header block)
            # This is a simple append for now
            echo "CHANGELOG.md exists, entry would be added"
          else
            echo "CHANGELOG.md not found, skipping update"
          fi

          echo "Changelog entry prepared (manual update recommended for now)"
