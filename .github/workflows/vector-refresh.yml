# Vector Index Refresh for Civic Platform
#
# Indexes documents into pgvector for semantic search.
# Parallelizes across corpus types for speed.
# Large corpuses (chunks, issues) are split into multiple jobs.
#
# Triggers:
#   - Weekly on Sunday at 6:00 AM UTC (Saturday 10:00 PM Pacific)
#   - Manual trigger via workflow_dispatch
#
# Prerequisites:
#   - DATABASE_URL secret configured in repository settings
#   - Cloud Postgres with pgvector extension enabled

name: Vector Refresh

on:
  schedule:
    # Weekly on Sunday at 6:00 AM UTC (Saturday 10:00 PM Pacific)
    - cron: '0 6 * * 0'

  # Allow manual trigger with options
  workflow_dispatch:
    inputs:
      corpus:
        description: 'Corpus type to index (or "all" for full refresh)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chunks
          - municipal_code
          - issues
          - meetings
          - transcripts
          - decisions
      reindex:
        description: 'Force reindex (delete existing vectors)'
        required: false
        default: false
        type: boolean

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  JURISDICTION: city-san-rafael

# Permissions needed for creating issues on failure
permissions:
  issues: write
  contents: read

jobs:
  # Index each corpus type in parallel
  # Large corpuses (chunks, issues) are split into multiple jobs
  index:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false  # Continue other jobs even if one fails
      matrix:
        include:
          # Small corpus types - single job each
          - corpus: decisions
            name: "Index decisions"
            offset: 0
            limit: ""
          - corpus: meetings
            name: "Index meetings"
            offset: 0
            limit: ""
          - corpus: transcripts
            name: "Index transcripts"
            offset: 0
            limit: ""
          - corpus: municipal_code
            name: "Index municipal_code"
            offset: 0
            limit: ""
          # Chunks (5084 docs) - split into 6 jobs of 1000 each
          - corpus: chunks
            name: "Index chunks (0-999)"
            offset: 0
            limit: 1000
          - corpus: chunks
            name: "Index chunks (1000-1999)"
            offset: 1000
            limit: 1000
          - corpus: chunks
            name: "Index chunks (2000-2999)"
            offset: 2000
            limit: 1000
          - corpus: chunks
            name: "Index chunks (3000-3999)"
            offset: 3000
            limit: 1000
          - corpus: chunks
            name: "Index chunks (4000-4999)"
            offset: 4000
            limit: 1000
          - corpus: chunks
            name: "Index chunks (5000+)"
            offset: 5000
            limit: 1000
          # Issues (1330 docs) - split into 2 jobs
          - corpus: issues
            name: "Index issues (0-699)"
            offset: 0
            limit: 700
          - corpus: issues
            name: "Index issues (700+)"
            offset: 700
            limit: 700

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install with fastembed (portable ONNX, no PyTorch needed)
          pip install psycopg2-binary  # Required for PostgresBackend
          pip install -e packages/civic-config
          pip install -e packages/civic[embeddings]
          pip install -e packages/civic-extraction

      - name: Check if should run this corpus
        id: check
        run: |
          # For scheduled runs or 'all', run everything
          # For manual runs with specific corpus, only run that one
          INPUT_CORPUS="${{ github.event.inputs.corpus || 'all' }}"
          if [ "$INPUT_CORPUS" == "all" ] || [ "$INPUT_CORPUS" == "${{ matrix.corpus }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: ${{ matrix.name }}
        if: steps.check.outputs.should_run == 'true'
        run: |
          REINDEX_FLAG=""
          if [ "${{ github.event.inputs.reindex }}" == "true" ]; then
            REINDEX_FLAG="--reindex"
          fi

          # Build offset/limit flags
          OFFSET_FLAG=""
          LIMIT_FLAG=""
          if [ "${{ matrix.offset }}" != "0" ]; then
            OFFSET_FLAG="--offset ${{ matrix.offset }}"
          fi
          if [ -n "${{ matrix.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ matrix.limit }}"
          fi

          civic-extract vectors \
            --jurisdiction $JURISDICTION \
            --corpus ${{ matrix.corpus }} \
            --provider fastembed \
            --batch-size 100 \
            $OFFSET_FLAG \
            $LIMIT_FLAG \
            $REINDEX_FLAG

      - name: Skip message
        if: steps.check.outputs.should_run == 'false'
        run: |
          echo "Skipping ${{ matrix.corpus }} - not selected for this run"

  # Verify and report results
  verify:
    name: Verify Index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: index
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary  # Required for PostgresBackend
          pip install -e packages/civic-config
          pip install -e packages/civic[embeddings]
          pip install -e packages/civic-extraction

      - name: Show vector statistics
        id: stats
        run: |
          echo "=========================================="
          echo "Vector Index Statistics"
          echo "=========================================="
          civic-extract vectors --jurisdiction $JURISDICTION --corpus all --stats 2>&1 | tee stats_output.txt

          # Check coverage - parse stats output
          TOTAL_INDEXED=$(grep -oP 'Indexed documents: \K\d+' stats_output.txt | awk '{sum+=$1}END{print sum}')
          echo "total_indexed=$TOTAL_INDEXED" >> $GITHUB_OUTPUT

      - name: Test search
        run: |
          echo "Testing semantic search..."
          civic-extract vectors \
            --jurisdiction $JURISDICTION \
            --corpus chunks \
            --stats \
            --test-search "housing development" || true

      - name: Verify vector-SQL sync
        id: verify
        run: |
          echo "=========================================="
          echo "Vector-SQL Sync Verification"
          echo "=========================================="
          # Verify that vector counts match SQL row counts (with 15% threshold)
          # This catches drift between pgvector indices and source SQL tables
          # Uses valid_to IS NULL filter to count current versions only
          civic-extract vectors \
            --jurisdiction $JURISDICTION \
            --corpus all \
            --verify-sync \
            --sync-threshold 0.15 \
            --provider fastembed

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [index, verify]
    if: failure()

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Vector refresh failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `## Vector Refresh Failure

            The scheduled vector refresh workflow failed.

            **Time:** ${new Date().toISOString()}
            **Workflow Run:** [View logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})

            ### Troubleshooting Steps

            1. Check the [workflow logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            2. Verify DATABASE_URL secret is configured
            3. Check pgvector extension is enabled on the database
            4. Try manual run with single corpus: workflow_dispatch with corpus=decisions

            ### Manual Recovery

            Run vector indexing manually:
            \`\`\`bash
            source civic-env/bin/activate
            export DATABASE_URL="your_connection_string"
            civic-extract vectors --jurisdiction city-san-rafael --corpus all --provider fastembed
            \`\`\`
            `;

            // Check for existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'vector-refresh-failure',
              state: 'open'
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['vector-refresh-failure', 'automated']
              });
              console.log('Created new issue for vector refresh failure');
            } else {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `Another vector refresh failure occurred at ${new Date().toISOString()}\n\n[View workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
              });
              console.log('Added comment to existing issue');
            }
