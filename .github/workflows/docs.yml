name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'packages/*/README.md'
      - 'apps/*/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-minify-plugin

      - name: Copy package READMEs
        run: |
          mkdir -p docs/packages
          cp packages/civicos/README.md docs/packages/civicos.md
          cp packages/civicos-relay/README.md docs/packages/civicos-relay.md
          cp packages/civicos-extraction/README.md docs/packages/civicos-extraction.md
          cp apps/civicos-mcp/README.md docs/packages/civicos-mcp.md

      - name: Build site
        run: mkdocs build --strict 2>&1 || mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
