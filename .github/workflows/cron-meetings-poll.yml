# Meetings Poll (4x daily)
#
# Triggers Modal function for lightweight meetings-only polling.
# If new meetings or minutes appear, spawns downstream extraction.
#
# Replaces Modal cron: "0 14,22,2,6 * * *" (every ~4h)
#
# Triggers:
#   - 4x daily: 2 AM, 6 AM, 2 PM, 10 PM UTC
#   - Manual trigger via workflow_dispatch

name: "Cron: Meetings Poll"

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  run:
    name: Meetings Poll
    runs-on: ubuntu-latest
    timeout-minutes: 100  # Modal timeout (1.5h) + 10 min buffer

    steps:
      - uses: actions/checkout@v4

      - name: Install Modal CLI and local packages
        run: |
          pip install modal
          pip install -e packages/civicos-config
          pip install -e packages/civicos
          pip install -e packages/civicos-extraction
          pip install -e packages/civicos-services

      - name: Trigger Modal function
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run scripts/modal_ingest.py::scheduled_meetings_poll

  notify-failure:
    name: Create Alert Issue
    runs-on: ubuntu-latest
    needs: run
    if: failure()

    steps:
      - name: Create or Update Issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `Cron failure: meetings-poll - ${today}`;
            const body = `## Cron Failure Alert

            **Workflow:** Meetings Poll
            **Time:** ${new Date().toISOString()}
            **Schedule:** 4x daily (2, 6, 14, 22 UTC)

            The scheduled meetings poll failed. This is a lightweight check that
            detects new meetings/minutes and triggers downstream extraction.

            **Manual retry:**
            \`\`\`bash
            gh workflow run cron-meetings-poll.yml
            # or directly:
            modal run scripts/modal_ingest.py::scheduled_meetings_poll
            \`\`\`

            **Workflow Run:** [View logs](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'cron-failure',
              state: 'open'
            });

            const existing = issues.data.find(i => i.title.includes('meetings-poll'));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['cron-failure', 'automated']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `## Recurrence - ${today}\n\n${body}`
              });
            }
