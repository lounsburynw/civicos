# Registry & Jurisdiction Validation
#
# Runs on PRs that touch jurisdiction YAML configs or the registry.
# Fast (~30s) — validates schema, integrity, and cross-consistency.
#
# Also runs generate_registries.py --check to flag when registries
# are out of sync with YAML sources.

name: Validate Registry

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/jurisdictions/*.yaml'
      - 'config/registry.json'
      - 'scripts/validate_registry.py'
      - 'scripts/generate_registries.py'
  push:
    branches: [main]
    paths:
      - 'data/jurisdictions/*.yaml'
      - 'config/registry.json'
  workflow_dispatch:

jobs:
  validate:
    name: Registry Validation
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate registry and YAML files
        run: |
          python scripts/validate_registry.py

      - name: Check registry sync (generate_registries.py --check)
        run: |
          pip install -e packages/civicos-config
          python scripts/generate_registries.py --check
