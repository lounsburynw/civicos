# Full Test Suite for Civic Platform
#
# Runs the complete test suite on GitHub's compute (not your laptop).
# Uses parallelization for speed (~10-15 min instead of 50+ min locally).
#
# Triggers:
#   - Push to main branch
#   - Pull requests to main branch
#   - Manual trigger via workflow_dispatch

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Quick smoke test - runs first, fast feedback
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Smoke tests only need core + dev deps (skip embeddings to save ~2GB disk)
          pip install -e packages/civic[dev]

      - name: Run smoke tests
        run: |
          pytest packages/civic/tests/test_civic.py -q --override-ini="addopts="

  # Full test suite - runs in parallel across multiple jobs
  full:
    name: Full Suite (${{ matrix.group }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke  # Only run if smoke tests pass

    strategy:
      fail-fast: false  # Let all groups complete even if one fails
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first (saves ~2GB by skipping CUDA drivers)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e packages/civic[all]
          pip install -e packages/civic-extraction
          pip install -r requirements.txt
          pip install -e packages/civic-services/  # Application layer (API servers, etc.)
          pip install pytest-split

      - name: Run test group ${{ matrix.group }}
        run: |
          pytest packages/civic/tests/ \
            --override-ini="addopts=" \
            --splits 8 \
            --group ${{ matrix.group }} \
            -n 2 \
            -q \
            --tb=short

  # Integration tests requiring database access
  # Only runs on main branch (not PRs from forks which can't access secrets)
  pgvector:
    name: PgVector Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke
    # Only run on push to main or manual dispatch (not PRs from forks)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e packages/civic[all]
          pip install -r requirements.txt

      - name: Run pgvector integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not configured - skipping pgvector tests"
            exit 0
          fi
          pytest packages/civic/tests/test_integration_pgvector.py -v --override-ini="addopts="

  # Summary job - reports overall status
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [smoke, full, pgvector]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.smoke.result }}" == "failure" ]; then
            echo "Smoke tests failed"
            exit 1
          fi
          if [ "${{ needs.full.result }}" == "failure" ]; then
            echo "Full test suite had failures"
            exit 1
          fi
          # pgvector is optional - may be skipped for PRs
          if [ "${{ needs.pgvector.result }}" == "failure" ]; then
            echo "PgVector integration tests failed"
            exit 1
          fi
          echo "All tests passed!"
