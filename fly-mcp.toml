# CivicOS MCP Server - Fly.io Configuration
# HTTP transport endpoint for Claude.ai, ChatGPT, and MCP clients
# See docs/critical/MCP_INTEGRATION_STRATEGY.md for deployment details
#
# Deploy: fly deploy --config fly-mcp.toml
# Logs:   fly logs --app civicos-mcp

app = "civicos-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.mcp"

[env]
  CIVICOS_ENV = "production"
  CIVICOS_JURISDICTION = "city-san-rafael"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[checks]
  [checks.health]
    # TCP check - MCP endpoint returns 406 without SSE headers, but TCP confirms server is up
    type = "tcp"
    port = 8000
    interval = "30s"
    timeout = "10s"
    grace_period = "15s"
