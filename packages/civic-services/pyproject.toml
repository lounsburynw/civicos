[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-services"
version = "0.1.0"
description = "Civic services layer - API servers, websocket, platform clients, and services"
requires-python = ">=3.10"
license = {text = "MIT"}

# Minimal dependencies - most come from civic package and requirements.txt
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civic_services = ["py.typed"]
