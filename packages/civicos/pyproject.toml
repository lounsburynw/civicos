[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicos"
version = "0.1.0"
description = "Unified civic engagement platform - from civicos import CivicOS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "PolyForm Noncommercial 1.0.0"}
authors = [
    {name = "Nicolas Lounsbury"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies (consolidated from civic-state, civic-legal, civic-coordination)
dependencies = [
    "civicos-config",       # Shared jurisdiction configuration
    "httpx>=0.24.0",      # Async HTTP for corpus fetching (from civic-legal)
]

[project.optional-dependencies]
# MCP server support
mcp = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
]
# Embeddings for semantic search (fastembed, ~500MB, production-ready)
embeddings = [
    "fastembed>=0.3.0",
    "chromadb>=0.4.0",
]
# Embeddings with SentenceTransformer (adds ~3GB with PyTorch)
embeddings-local = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "einops>=0.6.0",  # Required by nomic-embed-text-v1.5
]
# API-based embeddings (OpenAI)
embeddings-api = [
    "openai>=1.0.0",
    "chromadb>=0.4.0",
]
# HTTP server support
http = [
    "uvicorn>=0.20.0",
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0.0",
    "pytest-split>=0.8.0",  # For CI test splitting
]
# Install everything for full dev environment
all = [
    "civicos[mcp,embeddings,embeddings-local,embeddings-api,http,dev]",
]

[project.scripts]
civicos-server = "civicos.mcp:main"
civicos-state-server = "civicos._internal.state.mcp:main"
civicos-legal-server = "civicos._internal.legal.mcp:main"
civicos-status = "civicos.cli:main"
civicos-bootstrap = "civicos.cli:bootstrap_main"
civicos-deploy = "civicos.cli:deploy_main"
civicos-validate = "civicos.cli:validate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civicos = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Default: parallel execution with loadscope distribution
# -n 4: Use 4 workers (reduced from auto to limit memory usage)
# --dist loadscope: Keep tests in same class/module together (reduces isolation issues)
# Use -n0 to disable parallelization for debugging
addopts = "-v --tb=short -n 4 --dist loadscope"
markers = [
    "fast: Quick unit tests for local development (< 1s each)",
    "slow: Load tests and performance benchmarks (skip in local dev, CI-only)",
    "integration: Integration tests requiring real/semi-real data and database",
    "concurrent: Tests for concurrent access patterns",
    "rag: RAG infrastructure tests (embeddings, vector search)",
    "websocket: Real-time WebSocket integration tests",
    "requires_real_data: Tests requiring gitignored real data files (skip in CI)",
]

[tool.coverage.run]
source = ["src/civicos"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
