[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civicos-signer"
version = "0.1.0"
description = "Portable attestation signing service for CivicOS issuer organizations"
requires-python = ">=3.11"
dependencies = [
    "coincurve>=19.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
cli = [
    "httpx>=0.24.0",
]

[project.scripts]
civicos-signer = "civicos_signer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civicos_signer"]
