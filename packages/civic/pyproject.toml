[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civic"
version = "0.1.0"
description = "Unified civic engagement platform - from civic import Civic"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Civic Platform"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies (consolidated from civic-state, civic-legal, civic-coordination)
dependencies = [
    "httpx>=0.24.0",      # Async HTTP for corpus fetching (from civic-legal)
    "langgraph>=0.2.0",   # LangGraph workflows (from civic-coordination)
]

[project.optional-dependencies]
# MCP server support
mcp = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
]
# Embeddings for semantic search
embeddings = [
    "openai>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
# HTTP server support
http = [
    "uvicorn>=0.20.0",
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0.0",
    "pytest-split>=0.8.0",  # For CI test splitting
]
# Install everything
all = [
    "civic[mcp,embeddings,http,dev]",
]

[project.scripts]
civic-server = "civic.mcp:main"
civic-state-server = "civic._internal.state.mcp:main"
civic-legal-server = "civic._internal.legal.mcp:main"
civic-status = "civic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Default: parallel execution with loadscope distribution
# -n 4: Use 4 workers (reduced from auto to limit memory usage)
# --dist loadscope: Keep tests in same class/module together (reduces isolation issues)
# Use -n0 to disable parallelization for debugging
addopts = "-v --tb=short -n 4 --dist loadscope"
markers = [
    "fast: Quick unit tests for local development (< 1s each)",
    "slow: Load tests and performance benchmarks (skip in local dev, CI-only)",
    "integration: Integration tests requiring real/semi-real data and database",
    "concurrent: Tests for concurrent access patterns",
    "rag: RAG infrastructure tests (embeddings, vector search)",
    "websocket: Real-time WebSocket integration tests",
]

[tool.coverage.run]
source = ["src/civic"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
