[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicos-services"
version = "0.1.0"
description = "CivicOS services layer - API servers, websocket, platform clients, and services"
requires-python = ">=3.10"
license = {text = "PolyForm Noncommercial 1.0.0"}

# Minimal dependencies - most come from civicos package and requirements.txt
dependencies = [
    "civicos-config",       # Shared jurisdiction configuration
    "stripe>=8.0.0",        # Stripe billing integration
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civicos_services = ["py.typed"]

[tool.mutmut]
paths_to_mutate = ["src/civicos_services/"]
tests_dir = ["tests/"]
also_copy = ["src/civicos_services"]
pytest_add_cli_args = ["-x", "-q", "--tb=short", "--override-ini=addopts=", "-k", "not Integration and not RateLimiter and not CorpusSchemas and not Pagination"]
