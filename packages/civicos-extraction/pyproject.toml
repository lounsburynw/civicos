[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civicos-extraction"
version = "0.1.0"
description = "Platform clients for extracting civic meeting data - Legistar, CivicClerk, Granicus"
readme = "README.md"
license = {text = "PolyForm Noncommercial 1.0.0"}
requires-python = ">=3.9"
authors = [
    {name = "Nicolas Lounsbury"}
]
keywords = ["civicos", "legistar", "civicclerk", "granicus", "municipal", "meetings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",  # For HTML parsing in ProudCity client
    "google-api-python-client>=2.0.0",  # For YouTube Data API v3
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23.0",  # For mocking requests
]
scheduler = [
    "schedule>=1.2.0",  # For --schedule mode in CLI
]

[project.scripts]
civicos-extract = "civicos_extraction.cli:main"

[project.urls]
Homepage = "https://github.com/civicos-platform/civicos-extraction"
Documentation = "https://github.com/civicos-platform/civicos-extraction#readme"
Repository = "https://github.com/civicos-platform/civicos-extraction"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civicos_extraction = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
